<style>
        body {
            background-color: #050505; /* Near-black background for dark hero theme */
            color: #FAFAF8;
            overflow: hidden;
        }

        .halftone-glow {
            background: radial-gradient(circle at center, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            mask-image: radial-gradient(circle, black 1px, transparent 1.5px);
            mask-size: 12px 12px;
        }

        .avatar-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .hard-shadow {
            box-shadow: 6px 6px 0px 0px #000000;
        }

        .nav-dot {
            width: 10px;
            height: 10px;
            border: 2px solid #E5E5E2;
            border-radius: 9999px;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background-color: #4F46E5;
            border-color: #4F46E5;
            width: 24px;
        }

        .wordmark-container img {
            filter: invert(1) brightness(2);
        }

        /* Material Symbol custom weight */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">
<!-- Halftone Glow Layer -->
<div class="fixed inset-0 halftone-glow pointer-events-none z-0"></div>
<!-- Navigation Header (Suppressed as per task-focused logic, but including minimalist wordmark) -->
<header class="relative z-20 px-margin-desktop py-8 flex justify-center items-center">
<div class="wordmark-container w-32 md:w-40 opacity-90">
<img alt="HAIA Wordmark" class="w-full h-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAhKa-xvd4Fh3lzswWzbTZz04Hii2FSX1s-p9jGnj-v3RLWG49J-SOUORppW_9ZRt1zzfXK3xEwCSoC5KwFdAs6yyU4AYeVPpbzQ8X_7WpkLX4JO0st8FJeTgKTKJmdZk2g6leFCNLOl32Xm-sUG31agBTQdIovvkBNsVrY41-xnqrmtCzn4cLLvLZ872pwPkUj8PlqeNQ0IlwOPWUaWDpVrF9EwQFqtNqW6Qf2y7Sh992dVIcWSE-UVN3gyUGf7aI3enk0DeSEYBw"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 relative z-10 flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop">
<!-- AI Avatar Lightning Bolt -->
<div class="mb-12 relative">
<div class="avatar-float relative z-10">
<div class="w-32 h-32 md:w-48 md:h-48 flex items-center justify-center rounded-full bg-indigo-deep/10 border border-indigo-deep/20 backdrop-blur-sm p-4">
<img alt="HAIA Lightning Bolt Avatar" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqz6p-dXO2TZxfMYyqLWBm-24XleuBYDlZxuXHdyyYIl82JM81FfPTYh2Sg0AYp8ODoPqFv07IgrKHvIVT0yRwM-EXNk_80lTGnQ3I9SbhV-lSrQHSSHEXh7tlMncAawHUuFHa4Y3jV2H_f4zTdkhfi-5JUzGb_TAuix30-J8Vm3tUehgucxrdAQM1HddA7xvP-oA4uUfWuIj07Yw5UbcWJmDOsCDqAS-tYGq8ESVGEs83rc0CV1H1FaBdR1Qw3k46JpsM-rsvOwM"/>
</div>
</div>
<!-- Decorative ring behind avatar -->
<div class="absolute inset-0 scale-125 border border-indigo-deep/10 rounded-full animate-pulse"></div>
</div>
<!-- Headline Area -->
<div class="text-center max-w-2xl">
<h1 class="font-display-hero text-[48px] md:text-display-hero leading-tight mb-8">
                Turn your to-do list.<br/>
<span class="text-indigo-deep">Into a game.</span>
</h1>
<!-- Secondary Context (Muted) -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto mb-12">
                Level up your life with an AI coach that turns boring tasks into epic quests.
            </p>
<!-- Primary Action -->
<div class="flex flex-col items-center gap-6">
<button class="bg-indigo-deep text-on-primary font-headline-md text-headline-md px-12 py-5 rounded-lg hard-shadow active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-150 uppercase tracking-wider flex items-center gap-3">
                    Start Your Quest
                    <span class="material-symbols-outlined">bolt</span>
</button>
<p class="font-label-caps text-label-caps text-outline uppercase tracking-widest cursor-pointer hover:text-on-tertiary transition-colors">
                    Already a hero? Sign in
                </p>
</div>
</div>
</main>
<!-- Footer Area (Minimalist Dots) -->
<footer class="relative z-20 w-full pb-12 flex flex-col items-center gap-4">
<div class="flex gap-3">
<div class="nav-dot active"></div>
<div class="nav-dot"></div>
<div class="nav-dot"></div>
</div>
<!-- Utility link -->
<div class="mt-4 flex gap-6 opacity-30">
<span class="font-label-caps text-[10px] uppercase tracking-[0.2em]">Terms</span>
<span class="font-label-caps text-[10px] uppercase tracking-[0.2em]">Privacy</span>
<span class="font-label-caps text-[10px] uppercase tracking-[0.2em]">v1.0.4</span>
</div>
</footer>
<!-- Interactive Layer: Cursor Tracker (Subtle Glow) -->
<div class="fixed inset-0 pointer-events-none z-0 opacity-40 transition-opacity duration-300" id="cursor-glow" style="background: radial-gradient(circle 200px at 50% 50%, rgba(79, 70, 229, 0.15), transparent 80%);"></div>
<script>
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            glow.style.background = `radial-gradient(circle 250px at ${x}px ${y}px, rgba(79, 70, 229, 0.15), transparent 80%)`;
        });

        // Hover sound effect simulation / interaction cues
        const button = document.querySelector('button');
        button.addEventListener('mouseenter', () => {
            glow.style.opacity = '0.6';
        });
        button.addEventListener('mouseleave', () => {
            glow.style.opacity = '0.4';
        });
    </script>
</body></html>
